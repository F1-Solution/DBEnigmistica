services:
  postgres:
    image: postgres:18-alpine
    container_name: dbenigmistica_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Imposta POSTGRES_USER nel file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: ${POSTGRES_DB:?Imposta POSTGRES_DB nel file .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dbenigmistica_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Imposta PGADMIN_DEFAULT_EMAIL nel file .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Imposta PGADMIN_DEFAULT_PASSWORD nel file .env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
