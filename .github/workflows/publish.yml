name: Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# Mai annullare una pubblicazione in corso.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CONSOLE_PROJECT: src/DBEnigmistica.Console/DBEnigmistica.Console.csproj

jobs:
  # La pubblicazione dipende dal superamento di test, vulnerabilita' e controllo segreti.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Nessuna immagine e nessuna release partono da un commit che non sta nella storia di main (tag e avvio manuale).
  tag-da-main:
    name: Commit da main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (storia completa)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verifica che il commit discenda da main
        run: bash .github/scripts/verifica-tag-da-main.sh "$GITHUB_SHA" origin/main

  version:
    name: Versione
    needs: [ci, tag-da-main]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      latest: ${{ steps.v.outputs.latest }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - name: Calcola versione e nome immagine
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Il tag '$REF_NAME' non e' una versione valida (atteso vX.Y.Z o vX.Y.Z-suffisso)."
              exit 1
            fi
            version="${REF_NAME#v}"
          else
            version="0.0.0-manual.${SHA:0:7}"
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          # "latest" solo per versioni stabili o per avvii manuali dal ramo principale.
          latest=false
          if [ "$REF_TYPE" = "tag" ] && [ "$prerelease" = false ]; then latest=true; fi
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then latest=true; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "image=ghcr.io/${REPOSITORY,,}"   # GHCR richiede il minuscolo
          } >> "$GITHUB_OUTPUT"

  container:
    name: Immagine console (GHCR)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login a GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etichette e tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha
            type=raw,value=latest,enable=${{ needs.version.outputs.latest }}

      - name: Build e push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Per aggiungere un artefatto (API web, interfaccia web, desktop) basta una riga nella matrice
  # o un lavoro analogo; il lavoro "release" raccoglie tutto cio' che e' stato caricato.
  binaries:
    name: Eseguibile console (${{ matrix.rid }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, linux-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Pubblica (autonomo, ${{ matrix.rid }})
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: >
          dotnet publish "$CONSOLE_PROJECT" --configuration Release
          --runtime "$RID" --self-contained true
          -p:Version="$VERSION" --output "publish/$RID"

      - name: Crea archivio
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          # La pubblicazione deve contenere la configurazione e l'eseguibile "dbe".
          test -f "publish/$RID/appsettings.json"
          if [ "$RID" = "win-x64" ]; then test -f "publish/$RID/dbe.exe"; else test -f "publish/$RID/dbe"; fi
          # L'archivio deve contenere l'host del prototipo (dbe prototipo) con il runtime di ASP.NET Core.
          test -f "publish/$RID/DBEnigmistica.Web.dll"
          test -f "publish/$RID/Microsoft.AspNetCore.dll"
          # E i descrittori delle Tipologie che l'host legge accanto all'eseguibile.
          for id in crittografia-breve rebus sudoku futoshiki nonogramma; do test -f "publish/$RID/tipologie/$id/v0.json"; done
          # Deve esserci la libreria nativa di PDFium del sistema di destinazione.
          if [ "$RID" = "win-x64" ]; then test -f "publish/$RID/pdfium.dll"; else test -f "publish/$RID/libpdfium.so"; fi
          mkdir -p dist
          name="dbenigmistica-console-${VERSION}-${RID}"
          if [ "$RID" = "win-x64" ]; then
            (cd "publish/$RID" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" .)
          else
            tar -czf "dist/$name.tar.gz" -C "publish/$RID" .
          fi
          ls -l dist

      - name: Carica archivio
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    # Solo per i tag di versione; l'avvio manuale pubblica l'immagine ma non crea release.
    if: github.ref_type == 'tag'
    needs: [version, binaries, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Scarica archivi
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: console-*
          path: dist
          merge-multiple: true

      - name: Crea o aggiorna la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
