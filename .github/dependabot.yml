version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Restiamo sulla linea .NET 10 e su FluentAssertions 6 (la 8 ha licenza commerciale): niente salti di versione maggiore.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.Extensions.Hosting"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]
    groups:
      # Il primo gruppo che corrisponde vince: i pacchetti di test vanno prima di "Microsoft.*".
      test-tooling:
        patterns: ["xunit*", "Moq", "FluentAssertions", "coverlet*", "Microsoft.NET.Test.Sdk"]
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/interfaccia"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Versioni esatte in package.json: Dependabot propone l'aggiornamento esatto e basta, anche per i salti maggiori da rivedere.
    versioning-strategy: increase
    groups:
      interfaccia-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-base-images:
        patterns: ["*"]
